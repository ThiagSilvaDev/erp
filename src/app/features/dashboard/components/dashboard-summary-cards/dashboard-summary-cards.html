<div class="grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-3">
  @for (card of cards(); track card.path) {
    <a [routerLink]="card.path" class="block rounded outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
      <nz-card class="h-full border-slate-200 shadow-none transition hover:border-blue-300 hover:shadow-sm">
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0">
            <div class="truncate text-xs font-medium uppercase text-slate-500">{{ card.label }}</div>
            <div class="mt-1 text-2xl font-semibold leading-none text-slate-950">{{ card.value }}</div>
          </div>
          <span
            class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded bg-blue-50 text-lg text-blue-600"
          >
            <nz-icon [nzType]="card.icon" />
          </span>
        </div>
      </nz-card>
    </a>
  }
</div>
