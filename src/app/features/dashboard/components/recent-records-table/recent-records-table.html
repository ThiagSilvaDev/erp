<nz-card nzTitle="Recent records">
  <nz-table
    nzSize="middle"
    [nzData]="records()"
    [nzLoading]="isLoading()"
    [nzShowPagination]="false"
  >
    <thead>
      <tr>
        <th>Module</th>
        <th>Name</th>
        <th>Detail</th>
      </tr>
    </thead>
    <tbody>
      @for (record of records(); track record.module + record.name + record.detail) {
        <tr>
          <td>
            <a [routerLink]="record.path">{{ record.module }}</a>
          </td>
          <td>{{ record.name }}</td>
          <td>{{ record.detail || '-' }}</td>
        </tr>
      }
    </tbody>
  </nz-table>
</nz-card>
