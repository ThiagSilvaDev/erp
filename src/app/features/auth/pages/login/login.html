<main class="login-page">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="login-copy">
      <span class="eyebrow">ERP Web</span>
      <h1 id="login-title">Operations workspace</h1>
      <p>Access companies, catalog, customers, suppliers, users, and contact records.</p>
    </div>

    <nz-card class="login-card" nzTitle="Sign in">
      @if (errorMessage()) {
        <nz-alert
          nzType="error"
          [nzMessage]="errorMessage()"
          nzShowIcon
          class="mb-4"
        />
      }

      <form nz-form [formGroup]="form" nzLayout="vertical" (ngSubmit)="submit()">
        <nz-form-item>
          <nz-form-label nzFor="email" nzRequired>Email</nz-form-label>
          <nz-form-control nzErrorTip="Enter a valid email.">
            <input nz-input id="email" type="email" formControlName="email" autocomplete="email" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzFor="password" nzRequired>Password</nz-form-label>
          <nz-form-control nzErrorTip="Password is required.">
            <input
              nz-input
              id="password"
              type="password"
              formControlName="password"
              autocomplete="current-password"
            />
          </nz-form-control>
        </nz-form-item>

        <button
          nz-button
          nzType="primary"
          type="submit"
          class="w-full"
          [nzLoading]="isSubmitting()"
        >
          Sign in
        </button>
      </form>
    </nz-card>
  </section>
</main>
