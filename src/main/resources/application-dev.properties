spring.application.name=erp-api

erp.iam.jwt.secret=${ERP_IAM_JWT_SECRET:dev-secret-for-local-iam-jwt-signing-32-bytes}
erp.iam.jwt.issuer=erp-api
erp.iam.jwt.expiration=1h


spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret


spring.jpa.hibernate.ddl-auto=update


logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN


logging.level.com.thiagsilvadev.erpapi=DEBUG
