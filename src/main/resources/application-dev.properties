spring.application.name=erp-api

erp.iam.jwt.secret=${ERP_IAM_JWT_SECRET:dev-secret-for-local-iam-jwt-signing-32-bytes}
erp.iam.jwt.issuer=erp-api
erp.iam.jwt.expiration=1h


spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret


spring.jpa.hibernate.ddl-auto=update


logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN


logging.level.com.thiagsilvadev.erpapi=DEBUG


# OTLP endpoints used when the `otel` profile is active.
# Enable with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev,otel
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.opentelemetry.resource-attributes.deployment.environment=development
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics}
management.otlp.metrics.export.step=10s
management.otlp.metrics.export.base-time-unit=seconds
management.tracing.sampling.probability=1.0
management.metrics.distribution.percentiles-histogram.http.server.requests=true
