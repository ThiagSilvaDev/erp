# Isolated schema for database-backed tests. Uses a dedicated Postgres schema (erp_test) on the
# docker-compose database so test runs never pollute the shared development schema.
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase?currentSchema=erp_test
spring.datasource.username=myuser
spring.datasource.password=secret
# Guarantees the schema exists before any initializer (JPA, Modulith) touches the connection.
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS erp_test

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=erp_test
spring.jpa.properties.hibernate.hbm2ddl.create_schemas=true

spring.modulith.events.jdbc.schema-initialization.enabled=true

erp.iam.jwt.secret=test-secret-for-iam-jwt-signing-must-be-32-bytes
