<nz-card class="h-full border-slate-200 shadow-none">
  <div class="flex min-h-28 flex-col">
    <div class="flex items-start justify-between gap-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">
        {{ card().label }}
      </span>
      @if (card().snapshot) {
        <span
          class="rounded-full bg-sky-50 px-2 py-0.5 text-[10px] font-semibold uppercase text-sky-700"
        >
          Live
        </span>
      }
    </div>

    <div class="mt-3 text-2xl font-semibold leading-tight text-slate-950">{{ card().value }}</div>

    <div class="mt-auto flex flex-wrap items-center gap-x-2 gap-y-1 pt-3 text-xs">
      @if (card().previous; as previous) {
        <span class="text-slate-500">{{ previous }}</span>
      }
      @if (card().change !== undefined) {
        <span class="font-semibold" [class]="changeClass()">{{ changeText() }}</span>
      }
      @if (card().snapshot) {
        <span class="text-slate-500">Current snapshot</span>
      }
    </div>
  </div>
</nz-card>
